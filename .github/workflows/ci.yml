name: E2E Tests — Selenium + Cucumber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag filter'
        required: false
        default: '@smoke'
      browser:
        description: 'Browser'
        required: false
        default: 'chrome'
        type: choice
        options: [chrome, firefox]

jobs:
  e2e-selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Run E2E tests (headless)
        run: |
          mvn test \
            -Denv=local \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dheadless=true \
            -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@e2e and not @wip' }}"

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 30
